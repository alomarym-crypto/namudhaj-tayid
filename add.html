<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#283593">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>إضافة قضية</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Sakkal Majalla', 'Amiri', 'Traditional Arabic', serif;
    background: #f4f6f7;
    color: #2c3e37;
    direction: rtl;
    text-align: right;
    font-size: 18px;
    padding: 16px 14px 28px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  h1 { font-size: 22px; color: #283593; margin: 4px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .gear { background: none; border: none; font-size: 20px; color: #90a4ae; cursor: pointer; padding: 4px 6px; }

  .card { background: #fff; border: 1px solid #dfe6e2; border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 15px; color: #607d8b; margin-bottom: 6px; }
  input[type="text"], textarea, select {
    width: 100%; font-family: inherit; font-size: 20px; color: #263238;
    border: 1px solid #cfd8dc; border-radius: 9px; padding: 12px; background: #fff;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #283593; box-shadow: 0 0 0 3px rgba(40,53,147,.14); }
  .field { margin-bottom: 14px; }

  .circuits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .circuits button {
    font-family: inherit; font-size: 18px; font-weight: 700;
    padding: 13px 4px; border: 1px solid #cfd8dc; border-radius: 9px;
    background: #fff; color: #455a64; cursor: pointer;
  }
  .circuits button.on { background: #283593; border-color: #283593; color: #fff; }

  .more { background: none; border: none; color: #283593; font-family: inherit; font-size: 16px; padding: 6px 0; cursor: pointer; }
  #extra { display: none; }
  #extra.on { display: block; }

  .send {
    width: 100%; font-family: inherit; font-size: 20px; font-weight: 700; color: #fff;
    background: #283593; border: none; border-radius: 10px; padding: 15px; margin-top: 4px; cursor: pointer;
  }
  .send:disabled { background: #9fa8da; }

  #msg { margin-top: 12px; font-size: 16px; line-height: 1.9; min-height: 24px; }
  #msg.ok { color: #2e7d32; }
  #msg.bad { color: #c62828; }

  /* القراءة من صورة */
  .pick-row { display: flex; gap: 8px; flex-wrap: wrap; margin: -6px 0 14px; }
  .pick-row button {
    font-family: inherit; font-size: 16px; font-weight: 700; color: #283593;
    background: #e8eaf6; border: 1px solid #c5cae9; border-radius: 9px; padding: 10px 14px; cursor: pointer;
  }
  .pick-row button:disabled { opacity: .55; }
  #shot { display: none; }
  #paste-box { display: none; margin-bottom: 14px; }
  #paste-box.on { display: block; }
  #paste-box textarea { min-height: 90px; font-size: 16px; }
  #ocr-msg { font-size: 15px; color: #607d8b; margin-bottom: 8px; min-height: 0; }
  #ocr-out { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  #ocr-out button {
    font-family: inherit; font-size: 17px; font-weight: 700; direction: ltr;
    background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; border-radius: 14px; padding: 7px 13px; cursor: pointer;
  }
  #ocr-out button.off { background: #f5f5f5; color: #90a4ae; border-color: #e0e0e0; }
  #ocr-out button.warn { border-color: #ffb74d; }
  #ocr-out button.warn.on { background: #fff8e1; color: #8d4b00; }
  #ocr-out button.d { background: #e1f5fe; color: #01579b; border-color: #81d4fa; direction: rtl; }
  #ocr-out .lbl { font-size: 13px; font-weight: normal; color: #558b2f; margin-right: 5px; }
  #ocr-out button.off .lbl { color: #b0bec5; }
  #ocr-out button.d .lbl { color: #0277bd; }
  #multi-bar { display: none; }
  #multi-bar.on { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  #multi-bar button {
    font-family: inherit; font-size: 17px; font-weight: 700; color: #fff; background: #2e7d32;
    border: none; border-radius: 9px; padding: 11px 16px; cursor: pointer;
  }
  #multi-bar .m-note { font-size: 14px; color: #78909c; }

  #setup { display: none; }
  #setup.on { display: block; }
  #setup input { font-size: 14px; }
  .hint { font-size: 14px; color: #90a4ae; line-height: 1.9; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">

  <h1>إضافة قضية <button type="button" class="gear" onclick="toggleSetup()" title="الإعدادات">⚙</button></h1>

  <div class="card" id="setup">
    <div class="field">
      <label for="url">رابط سكربت الورقة (تطبيق الويب)</label>
      <input type="text" id="url" placeholder="https://script.google.com/macros/s/..../exec" autocomplete="off">
    </div>
    <button type="button" class="send" onclick="saveUrl()">حفظ</button>
    <p class="hint">يُحفظ في هذا الجهاز وحده، ولا يُطلب منك مرة أخرى.</p>
  </div>

  <div class="card" id="form">
    <div class="field">
      <label for="caseNo">رقم القضية</label>
      <input type="text" id="caseNo" inputmode="numeric" autocomplete="off" enterkeyhint="done">
    </div>

    <div class="pick-row">
      <button type="button" id="shot-btn" onclick="document.getElementById('shot').click()">📷 قراءة من صورة</button>
      <button type="button" onclick="togglePasteBox()">📋 لصق نص</button>
      <input type="file" id="shot" accept="image/*" onchange="readShot(this)">
    </div>

    <div id="paste-box">
      <textarea id="ocr_paste" rows="3" placeholder="ألصق هنا ما نسخته من الصورة أو من النظام…" oninput="scanText(this.value)"></textarea>
    </div>

    <div id="ocr-msg"></div>
    <div id="ocr-out"></div>
    <div id="multi-bar"></div>

    <div class="field">
      <label>الدائرة</label>
      <div class="circuits">
        <button type="button" data-c="الدائرة الأولى" onclick="pickCircuit(this)">الأولى</button>
        <button type="button" data-c="الدائرة الثانية" onclick="pickCircuit(this)">الثانية</button>
        <button type="button" data-c="الدائرة الثالثة" onclick="pickCircuit(this)">الثالثة</button>
        <button type="button" data-c="الدائرة الرابعة" onclick="pickCircuit(this)">الرابعة</button>
        <button type="button" data-c="الدائرة الخامسة" onclick="pickCircuit(this)">الخامسة</button>
        <button type="button" data-c="الدائرة السادسة" onclick="pickCircuit(this)">السادسة</button>
      </div>
    </div>

    <button type="button" class="more" onclick="toggleExtra()">+ إضافة الإجراء أو التاريخ أو ملاحظة</button>

    <div id="extra">
      <div class="field">
        <label for="action">الإجراء</label>
        <input type="text" id="action" list="acts" autocomplete="off">
        <datalist id="acts">
          <option value="دراسة قضية">
          <option value="طلب سجين">
          <option value="اطلاع على التماس">
          <option value="طلب مقطع فيديو">
          <option value="طلب شهود">
          <option value="مناقشة قضية">
        </datalist>
      </div>
      <div class="field">
        <label for="date">تاريخ الجلسة (هجري)</label>
        <input type="text" id="date" inputmode="numeric" placeholder="3/4/1448" autocomplete="off">
      </div>
      <div class="field">
        <label for="note">ملاحظات</label>
        <textarea id="note" rows="2"></textarea>
      </div>
    </div>

    <button type="button" class="send" id="sendBtn" onclick="send()">إضافة</button>
    <div id="msg"></div>
  </div>

</div>

<script>
(function () {
  var URL_KEY = 'add_sheet_url_v1';
  var url = '', circuit = '';

  function load() {
    try { url = localStorage.getItem(URL_KEY) || ''; } catch (e) { url = ''; }
    if (!url) document.getElementById('setup').classList.add('on');
    document.getElementById('url').value = url;
  }

  function toggleSetup() { document.getElementById('setup').classList.toggle('on'); }
  function toggleExtra() { document.getElementById('extra').classList.toggle('on'); }

  function saveUrl() {
    var v = (document.getElementById('url').value || '').trim();
    if (!v) { msg('الصق الرابط أولاً.', 'bad'); return; }
    url = v;
    try { localStorage.setItem(URL_KEY, v); } catch (e) {}
    document.getElementById('setup').classList.remove('on');
    msg('حُفظ الرابط.', 'ok');
  }

  function pickCircuit(btn) {
    var all = document.querySelectorAll('.circuits button');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
    btn.classList.add('on');
    circuit = btn.getAttribute('data-c');
    try { localStorage.setItem(CIRC_KEY, circuit); } catch (e) {}
  }

  function msg(t, cls) {
    var el = document.getElementById('msg');
    el.className = cls || '';
    el.innerText = t;
  }

  function val(id) { return (document.getElementById(id).value || '').trim(); }

  function toWestern(s) {
    return String(s || '').replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); });
  }

  function send() {
    if (!url) { document.getElementById('setup').classList.add('on'); msg('الصق رابط السكربت أولاً.', 'bad'); return; }
    var caseNo = toWestern(val('caseNo')).replace(/[^0-9\/\-]/g, '');
    if (!caseNo) { msg('اكتب رقم القضية.', 'bad'); document.getElementById('caseNo').focus(); return; }
    if (!circuit) { msg('اختر الدائرة.', 'bad'); return; }

    var body = {
      action: 'add',                 // الأمر المرسل للسكربت
      caseNo: caseNo,
      circuit: circuit,
      proc: val('action'),           // الإجراء
      date: toWestern(val('date')),
      note: val('note')
    };

    var btn = document.getElementById('sendBtn');
    btn.disabled = true;
    msg('يجري الإرسال…', '');

    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        btn.disabled = false;
        if (out && out.ok) {
          try { localStorage.setItem(CIRC_KEY, circuit); } catch (e) {}
          msg('أُضيفت القضية ' + caseNo + ' — ' + circuit.replace('الدائرة ', ''), 'ok');
          clearForm();
        } else {
          msg('تعذرت الإضافة. تأكد من الرابط ومن نشر السكربت «لأي شخص لديه الرابط».', 'bad');
        }
      })
      .catch(function () {
        btn.disabled = false;
        msg('تعذر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.', 'bad');
      });
  }

  function clearForm() {
    document.getElementById('caseNo').value = '';
    document.getElementById('action').value = '';
    document.getElementById('date').value = '';
    document.getElementById('note').value = '';
    found = []; foundDates = [];
    document.getElementById('ocr-out').innerHTML = '';
    document.getElementById('multi-bar').className = '';
    document.getElementById('multi-bar').innerHTML = '';
    document.getElementById('ocr_paste').value = '';
    ocrMsg('');
    document.getElementById('caseNo').focus();
  }

  /* ===== قراءة الأرقام من صورة =====
     القراءة تجري في الجهاز نفسه بلا خادم. محرّك القراءة يُنزَّل أول مرة فقط ثم يُخزَّن. */
  var TJS = [
    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'
  ];
  var tjsLoading = null;

  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (tjsLoading) return tjsLoading;
    tjsLoading = new Promise(function (ok, bad) {
      var i = 0;
      (function next() {
        if (i >= TJS.length) { bad(new Error('no engine')); return; }
        var s = document.createElement('script');
        s.src = TJS[i++];
        s.onload = function () { ok(); };
        s.onerror = function () { next(); };
        document.head.appendChild(s);
      })();
    });
    return tjsLoading;
  }

  var shotCanvas = null;
  var found = [], foundDates = [];
  var CIRC_KEY = 'add_last_circuit_v1';

  function ocrMsg(t) { document.getElementById('ocr-msg').innerText = t || ''; }

  // اختيار الدائرة من أزرارها بالاسم
  function setCircuit(name, why) {
    var all = document.querySelectorAll('.circuits button');
    var hit = null;
    for (var i = 0; i < all.length; i++) {
      all[i].classList.remove('on');
      if (all[i].getAttribute('data-c') === name) hit = all[i];
    }
    if (!hit) { circuit = ''; return false; }
    hit.classList.add('on');
    circuit = name;
    if (why) ocrMsg(why);
    return true;
  }

  // تبسيط الحروف حتى لا تمنع الهمزات والتاء المربوطة المطابقة
  function arNorm(s) {
    return String(s || '')
      .replace(/[ً-ْـ]/g, '')
      .replace(/[أإآا]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/\s+/g, '');
  }

  var CIRCUIT_WORDS = [
    { w: 'الاولي', c: 'الدائرة الأولى' },
    { w: 'الثانيه', c: 'الدائرة الثانية' },
    { w: 'الثالثه', c: 'الدائرة الثالثة' },
    { w: 'الرابعه', c: 'الدائرة الرابعة' },
    { w: 'الخامسه', c: 'الدائرة الخامسة' },
    { w: 'السادسه', c: 'الدائرة السادسة' }
  ];

  function circuitFromText(text) {
    var t = arNorm(text);
    var hits = CIRCUIT_WORDS.filter(function (x) { return t.indexOf(x.w) !== -1; });
    return hits.length === 1 ? hits[0].c : '';   // إن تعددت فلا يُخمَّن
  }

  // قراءة عربية ثانية للصورة، لتبيّن اسم الدائرة وحده
  function readCircuit(cv) {
    if (!cv || !window.Tesseract) return;
    return window.Tesseract.recognize(cv, 'ara', {
      logger: function (m) {
        if (m.status === 'recognizing text') ocrMsg('يجري تبيّن الدائرة… ' + Math.round((m.progress || 0) * 100) + '٪');
      }
    }).then(function (r) {
      var name = circuitFromText((r && r.data && r.data.text) || '');
      if (name) { setCircuit(name, 'جاهز: ' + name + ' (من الصورة) — اضغط «إضافة».'); return; }
      useLastCircuit('لم تتبيّن الدائرة من الصورة');
    }).catch(function () { useLastCircuit('تعذّرت قراءة اسم الدائرة'); });
  }

  function useLastCircuit(why) {
    var last = '';
    try { last = localStorage.getItem(CIRC_KEY) || ''; } catch (e) {}
    if (last && setCircuit(last)) ocrMsg(why + ' — اخترتُ ' + last + ' (آخر ما اخترته). غيّرها إن لزم ثم اضغط «إضافة».');
    else ocrMsg(why + '. اختر الدائرة ثم اضغط «إضافة».');
  }

  function togglePasteBox() {
    var b = document.getElementById('paste-box');
    b.classList.toggle('on');
    if (b.classList.contains('on')) document.getElementById('ocr_paste').focus();
  }

  // تصغير الصورة وتحويلها رمادية مع شدّ التباين، وقلبها إن كانت خلفيتها داكنة
  function prepImage(file) {
    return new Promise(function (ok, bad) {
      var img = new Image();
      img.onload = function () {
        // الصورة تُكبَّر إن كانت صغيرة، فالأرقام الدقيقة تُقرأ أصحّ، وتُصغَّر إن تجاوزت الحد
        var max = 2400, min = 1500;
        var big = Math.max(img.width, img.height);
        var sc = big < min ? Math.min(2, min / big) : Math.min(1, max / big);
        var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.drawImage(img, 0, 0, w, h);
        var d = cx.getImageData(0, 0, w, h), a = d.data, sum = 0;
        for (var i = 0; i < a.length; i += 4) {
          var g = (a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114) | 0;
          a[i] = a[i + 1] = a[i + 2] = g;
          sum += g;
        }
        var mean = sum / (a.length / 4);
        if (mean < 120) for (var j = 0; j < a.length; j += 4) {   // خلفية داكنة: تُقلب
          a[j] = a[j + 1] = a[j + 2] = 255 - a[j];
        }
        cx.putImageData(d, 0, 0);
        URL.revokeObjectURL(img.src);
        ok(cv);
      };
      img.onerror = function () { bad(new Error('bad image')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function digitsPass(cv, psm, label) {
    return window.Tesseract.recognize(cv, 'eng', {
      logger: function (m) {
        if (m.status === 'recognizing text') ocrMsg(label + Math.round((m.progress || 0) * 100) + '٪');
      },
      tessedit_char_whitelist: '0123456789/',
      tessedit_pageseg_mode: psm
    }).then(function (r) { return (r && r.data && r.data.text) || ''; })
      .catch(function () { return ''; });
  }

  function readShot(input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    var btn = document.getElementById('shot-btn');
    btn.disabled = true;
    document.getElementById('ocr-out').innerHTML = '';
    ocrMsg('يجري تجهيز الصورة…');

    prepImage(file)
      .then(function (cv) {
        shotCanvas = cv;
        ocrMsg('يجري تحميل محرّك القراءة…');
        return loadTesseract().then(function () {
          // قراءتان بطريقتين مختلفتين، فما سقط من إحداهما تلتقطه الأخرى
          ocrMsg('يجري قراءة الصورة…');
          return digitsPass(cv, '11', 'يجري قراءة الصورة… ')
            .then(function (a) {
              return digitsPass(cv, '6', 'مراجعة القراءة… ').then(function (b) { return a + '\n' + b; });
            });
        });
      })
      .then(function (text) {
        btn.disabled = false;
        var n = scanText(text || '', true);
        if (!n) { ocrMsg('لم يُعثر على رقم قضية في الصورة. جرّب صورة أوضح أو «لصق نص».'); return; }
        ocrMsg('يجري تبيّن الدائرة…');
        return readCircuit(shotCanvas);
      })
      .catch(function () {
        btn.disabled = false;
        ocrMsg('تعذّرت القراءة. تأكد من الإنترنت أول مرة، أو استعمل «لصق نص».');
      });
  }

  // يستخرج أرقام القضايا (7–12 رقماً) والتواريخ الهجرية من أي نص
  function scanText(text, autofill) {
    var t = toWestern(text || '');
    var nums = [], dates = [];
    var DATE_RE = /\d{1,2}\s*\/\s*\d{1,2}\s*\/\s*14\d\d/g;
    (t.match(DATE_RE) || []).forEach(function (x) {
      var v = x.replace(/\s+/g, '');
      if (dates.indexOf(v) === -1) dates.push(v);
    });

    // سطراً سطراً، حتى لا تلتصق أرقام سطرين فيصيرا رقماً واحداً
    function add(v) { if (v.length >= 7 && v.length <= 12 && nums.indexOf(v) === -1) nums.push(v); }
    t.split(/\r?\n/).forEach(function (line) {
      var L = line.replace(DATE_RE, ' ');
      (L.match(/\d{7,12}/g) || []).forEach(add);
      var bare = L.replace(/[^\d]/g, '');            // رقم فُرّقت أجزاؤه بمسافات في سطر واحد
      if (bare && !/\d{7,12}/.test(L)) add(bare);
    });

    // أرقام القضايا عشر خانات غالباً، فتُقدَّم على ما سواها
    nums.sort(function (a, b) { return (a.length === 10 ? 0 : 1) - (b.length === 10 ? 0 : 1); });

    // الأرقام التامة (عشر خانات) تُحدَّد وحدها، والناقصة تبقى معروضة بلا تحديد
    found = nums.map(function (v) { return { n: v, on: v.length === 10 }; });
    if (!found.some(function (x) { return x.on; }) && found.length) found[0].on = true;
    foundDates = dates;
    renderFound(autofill);
    return nums.length;
  }

  function renderFound(autofill) {
    var out = document.getElementById('ocr-out');
    out.innerHTML =
      found.map(function (x, i) {
        return '<button type="button" class="' + (x.on ? 'on' : 'off') + (x.n.length === 10 ? '' : ' warn') + '"' +
          ' onclick="toggleFound(' + i + ')" title="' + (x.n.length === 10 ? 'اضغط للتحديد أو إلغائه' : 'عدد خاناته ' + x.n.length + ' — راجعه') + '">' +
          '<span class="lbl">' + (x.on ? '✓' : '') + ' قضية</span>' + x.n + '</button>';
      }).join('') +
      foundDates.map(function (v) {
        return '<button type="button" class="d" onclick="useDate(\'' + v + '\')"><span class="lbl">تاريخ</span>' + v + '</button>';
      }).join('');

    var on = found.filter(function (x) { return x.on; });
    if (autofill !== false) document.getElementById('caseNo').value = on.length ? on[0].n : '';

    var bar = document.getElementById('multi-bar');
    if (on.length > 1) {
      bar.className = 'on';
      bar.innerHTML = '<button type="button" onclick="addAll()">➕ إضافة المحددة (' + on.length + ')</button>' +
        '<span class="m-note">تُضاف كلها بالدائرة المختارة</span>';
    } else { bar.className = ''; bar.innerHTML = ''; }

    var bad = on.filter(function (x) { return x.n.length !== 10; });
    if (bad.length) ocrMsg('تنبيه: ' + bad.map(function (x) { return x.n; }).join('، ') +
      ' ليست عشر خانات — راجع الرقم أو صحّحه في الخانة.');
  }

  function toggleFound(i) {
    if (!found[i]) return;
    found[i].on = !found[i].on;
    renderFound(true);
  }

  // إضافة كل الأرقام المحددة، واحداً بعد واحد، بالدائرة المختارة
  function addAll() {
    var on = found.filter(function (x) { return x.on; }).map(function (x) { return x.n; });
    if (!on.length) return;
    if (!url) { document.getElementById('setup').classList.add('on'); msg('الصق رابط السكربت أولاً.', 'bad'); return; }
    if (!circuit) { msg('اختر الدائرة.', 'bad'); return; }
    if (!confirm('إضافة ' + on.length + ' قضايا بـ' + circuit + '؟\n' + on.join('\n'))) return;

    var i = 0, okN = 0, badN = [];
    document.getElementById('sendBtn').disabled = true;

    function step() {
      if (i >= on.length) {
        document.getElementById('sendBtn').disabled = false;
        msg('أُضيفت ' + okN + ' من ' + on.length + (badN.length ? ' — تعذّرت: ' + badN.join('، ') : ''), badN.length ? 'bad' : 'ok');
        if (!badN.length) clearForm();
        return;
      }
      var n = on[i++];
      msg('يجري إضافة ' + i + ' من ' + on.length + '…', '');
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add', caseNo: n, circuit: circuit, proc: val('action'), date: toWestern(val('date')), note: val('note') })
      })
        .then(function (r) { return r.json(); })
        .then(function (o) { if (o && o.ok) okN++; else badN.push(n); step(); })
        .catch(function () { badN.push(n); step(); });
    }
    step();
  }

  function useNum(v) {
    document.getElementById('caseNo').value = v;
    msg('رقم القضية: ' + v, 'ok');
  }

  function useDate(v) {
    document.getElementById('extra').classList.add('on');
    document.getElementById('date').value = v;
    msg('تاريخ الجلسة: ' + v, 'ok');
  }

  window.togglePasteBox = togglePasteBox;
  window.toggleFound = toggleFound;
  window.addAll = addAll;
  window.readShot = readShot;
  window.scanText = scanText;
  window.useNum = useNum;
  window.useDate = useDate;

  window.toggleSetup = toggleSetup;
  window.toggleExtra = toggleExtra;
  window.saveUrl = saveUrl;
  window.pickCircuit = pickCircuit;
  window.send = send;

  document.getElementById('caseNo').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });

  load();
})();
</script>
</body>
</html>
