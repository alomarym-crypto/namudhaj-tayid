<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعداد الدراسة للقضايا الجنائية</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Sakkal Majalla', 'Amiri', 'Traditional Arabic', serif;
    background: #f4f6f7;
    color: #2c3e37;
    direction: rtl;
    text-align: right;
    font-size: 17px;
    line-height: 1.6;
  }

  /* ===== الشاشة الرئيسية ===== */
  #home { min-height: 100%; display: flex; flex-direction: column; padding: 28px 18px 18px; }
  .head { text-align: center; margin-bottom: 26px; }
  .head h1 {
    color: #1b5e20;
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }
  .head p { margin: 0; color: #78909c; font-size: 14px; }

  .entries { width: 100%; max-width: 640px; margin: 0 auto; }

  .entry {
    display: block;
    width: 100%;
    text-align: right;
    font-family: inherit;
    background: #ffffff;
    border: 1px solid #dfe6e2;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    cursor: pointer;
    color: inherit;
  }
  .entry:focus-visible { outline: 3px solid #1b5e20; outline-offset: 2px; }

  /* المتاح للموظفين: شريط مصمت. المقفل للقضاة: شريط متقطّع يدل على وجود حاجز */
  .entry-open   { border-right: 6px solid var(--accent); }
  .entry-locked { border-right: 6px dashed var(--accent); }
  .entry-open:hover, .entry-locked:hover { background: var(--accent-soft); }

  /* لون مميز لكل نموذج */
  .entry-tayeed    { --accent: #1b5e20; --accent-soft: #f2f8f3; }
  .entry-study     { --accent: #2a7ab0; --accent-soft: #f1f7fb; }
  .entry-reasoning { --accent: #b35309; --accent-soft: #fdf7f1; }

  /* قيد التطوير: بلا حافة ولا تفاعل */
  .entry-soon {
    background: #eef1f0;
    border-style: dashed;
    border-color: #cbd5d0;
    color: #90a4ae;
    cursor: not-allowed;
  }

  .role { display: block; font-size: 13px; color: #78909c; margin-bottom: 4px; }
  .entry-soon .role { color: #a0aeb5; }
  .name { display: block; font-size: 21px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .entry-soon .name { color: #90a4ae; font-weight: 600; }
  .desc { display: block; font-size: 14px; color: #607d8b; }
  .entry-soon .desc { color: #a0aeb5; }

  .lock-tag {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 12px;
    margin-right: 6px;
  }

  .foot {
    margin-top: auto;
    padding-top: 24px;
    text-align: center;
    font-size: 11px;
    color: #90a4ae;
  }

  /* ===== نافذة رمز الدخول ===== */
  #gate {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 35, 28, 0.55);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  #gate.on { display: flex; }
  .gate-box {
    background: #fff;
    border-radius: 10px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  .gate-box h2 { margin: 0 0 6px; font-size: 21px; color: #1b5e20; }
  .gate-box p { margin: 0 0 16px; font-size: 14px; color: #607d8b; }
  .code-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  .code-box {
    width: 54px;
    height: 60px;
    font-family: inherit;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    border: 1px solid #cfd8dc;
    border-radius: 8px;
    background: #fff;
    color: #2c3e37;
  }
  .code-box:focus { outline: none; border-color: #1b5e20; box-shadow: 0 0 0 2px rgba(27,94,32,0.15); }
  .code-row.shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #code-error { display: none; color: #c62828; font-size: 13px; margin-bottom: 10px; }
  #code-error.on { display: block; }
  .gate-row { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    font-family: inherit;
    font-size: 16px;
    padding: 11px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-go { background: #1b5e20; color: #fff; }
  .btn-cancel { background: #eceff1; color: #455a64; }

  /* ===== شاشة النموذج ===== */
  #viewer { display: none; flex-direction: column; height: 100%; }
  #viewer.on { display: flex; }
  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #1b5e20;
    transition: background .15s;
    color: #fff;
    padding: 9px 14px;
    flex: none;
  }
  .bar button {
    font-family: inherit;
    font-size: 15px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .bar button:hover { background: rgba(255,255,255,0.26); }
  .bar span { font-size: 16px; font-weight: 600; }
  #frame { flex: 1; width: 100%; border: none; background: #f4f6f7; }

  @media (max-width: 420px) {
    #home { padding: 20px 12px 12px; }
    .head h1 { font-size: 25px; }
    .name { font-size: 19px; }
  }
</style>
</head>
<body>

<div id="home">
  <div class="head">
    <h1>إعداد الدراسة للقضايا الجنائية</h1>
    <p>محكمة الاستئناف بمكة المكرمة — إعداد/ محمد حسن العُمري</p>
  </div>

  <div class="entries">
    <button class="entry entry-open entry-tayeed" onclick="openForm('tayeed')">
      <span class="role">للموظفين</span>
      <span class="name">نموذج التأييد</span>
      <span class="desc">إعداد دراسة تأييد الحكم تدقيقاً</span>
    </button>

    <button class="entry entry-locked entry-study" onclick="askCode('study')">
      <span class="role">للقضاة<span class="lock-tag">يتطلب رمز دخول</span></span>
      <span class="name">نموذج الدراسة القضائية</span>
      <span class="desc">تدقيقاً ومرافعة ومنقوضة، مع قسم الاستئناف والمحكمة العليا</span>
    </button>

    <button class="entry entry-locked entry-reasoning" onclick="askCode('reasoning')">
      <span class="role">للقضاة<span class="lock-tag">يتطلب رمز دخول</span></span>
      <span class="name">تسبيب الأحكام</span>
      <span class="desc">معالج يولّد مسودة التسبيب بالأسئلة من القوالب النظامية</span>
    </button>
  </div>

  <div class="foot">تاريخ النسخة: 2026-09-15 الساعة 22:14</div>
</div>

<div id="gate" role="dialog" aria-modal="true">
  <div class="gate-box">
    <h2 id="gate-name">نموذج الدراسة القضائية</h2>
    <p>هذا النموذج مخصص للقضاة. أدخل رمز الدخول للمتابعة.</p>
    <div class="code-row" id="code-row">
      <input class="code-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="code-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="code-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="code-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off">
    </div>
    <div id="code-error">الرمز غير صحيح. حاول مرة أخرى.</div>
    <div class="gate-row">
      <button class="btn btn-cancel" onclick="closeGate()">إلغاء</button>
    </div>
  </div>
</div>

<div id="viewer">
  <div class="bar">
    <button type="button" onclick="goHome()">الرئيسية</button>
    <span id="vtitle"></span>
  </div>
  <iframe id="frame" allow="clipboard-write" title="النموذج"></iframe>
</div>

var pendingForm = null;

// فك الترميز مع دعم كامل للنصوص العربية
function decodeForm(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function openForm(key) {
  var f = FORMS[key];
  document.getElementById('vtitle').innerText = f.title;
  document.querySelector('.bar').style.background = f.color;
  document.getElementById('frame').srcdoc = decodeForm(f.data);
  document.getElementById('home').style.display = 'none';
  document.getElementById('viewer').classList.add('on');
  window.scrollTo(0, 0);
}

function goHome() {
  if (!confirm('العودة للرئيسية تُغلق النموذج، وأي بيانات لم تنسخها ستُفقد. هل تريد المتابعة؟')) return;
  document.getElementById('frame').srcdoc = '';
  document.getElementById('viewer').classList.remove('on');
  document.getElementById('home').style.display = 'flex';
}

var codeBoxes = Array.prototype.slice.call(document.querySelectorAll('.code-box'));

function clearBoxes() {
  codeBoxes.forEach(function (b) { b.value = ''; });
}

function askCode(target) {
  if (!REQUIRE_CODE) { openForm(target); return; }
  pendingForm = target;
  document.getElementById('gate-name').innerText = FORMS[target].title;
  clearBoxes();
  document.getElementById('code-error').classList.remove('on');
  document.getElementById('gate').classList.add('on');
  setTimeout(function () { codeBoxes[0].focus(); }, 50);
}

function closeGate() {
  document.getElementById('gate').classList.remove('on');
}

// يُستدعى تلقائياً بمجرد امتلاء الخانات الأربع
function checkCode() {
  var v = codeBoxes.map(function (b) { return b.value; }).join('');
  if (v === JUDGE_CODE) {
    closeGate();
    openForm(pendingForm);
  } else {
    var row = document.getElementById('code-row');
    document.getElementById('code-error').classList.add('on');
    row.classList.add('shake');
    setTimeout(function () { row.classList.remove('shake'); }, 300);
    clearBoxes();
    codeBoxes[0].focus();
  }
}

// عند إلغاء الرمز: أخفِ وسم "يتطلب رمز دخول" حتى لا توهم البطاقة بوجود حماية
if (!REQUIRE_CODE) {
  Array.prototype.forEach.call(document.querySelectorAll('.lock-tag'), function (t) {
    t.style.display = 'none';
  });
  Array.prototype.forEach.call(document.querySelectorAll('.entry-locked'), function (e) {
    e.classList.remove('entry-locked');
    e.classList.add('entry-open');
  });
}

codeBoxes.forEach(function (box, i) {
  box.addEventListener('input', function () {
    // أرقام فقط
    box.value = box.value.replace(/[^0-9]/g, '');
    document.getElementById('code-error').classList.remove('on');
    if (box.value && i < codeBoxes.length - 1) {
      codeBoxes[i + 1].focus();
    }
    var filled = codeBoxes.every(function (b) { return b.value.length === 1; });
    if (filled) setTimeout(checkCode, 80);
  });

  box.addEventListener('keydown', function (e) {
    if (e.key === 'Backspace' && !box.value && i > 0) {
      codeBoxes[i - 1].focus();
      codeBoxes[i - 1].value = '';
      e.preventDefault();
    }
  });

  box.addEventListener('focus', function () { box.select(); });
});

document.getElementById('gate').addEventListener('click', function (e) {
  if (e.target === this) closeGate();
});
</script>
